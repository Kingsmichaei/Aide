# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: aide-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: uv sync --frozen --no-dev
    # Free instances have no preDeployCommand, so migrations run on start.
    # On a paid plan, move `alembic upgrade head` to preDeployCommand.
    startCommand: uv run --no-sync alembic upgrade head && uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: DATABASE_URL
        fromDatabase:
          name: aide-db
          property: connectionString
      - key: PAYPAL_ENVIRONMENT
        value: SANDBOX
      - key: FRONTEND_URL # e.g. https://aide-web.onrender.com (no trailing slash)
        sync: false
      - key: SECRET_KEY # signs the session cookie
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: KERNEL_API_KEY
        sync: false
      - key: RENDER_API_KEY
        sync: false

  - type: web
    name: aide-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      # The API is served from this site's origin, so the HTTP-only session
      # cookie is first-party. Change the URL if Render named the API differently.
      - type: rewrite
        source: /api/*
        destination: https://aide-api.onrender.com/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_PAYPAL_CLIENT_ID # same sandbox client id as PAYPAL_CLIENT_ID
        sync: false

databases:
  - name: aide-db
    plan: free
    databaseName: aide
    user: aide
    ipAllowList: [] # internal connections only
