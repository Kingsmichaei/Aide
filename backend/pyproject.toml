[project]
name = "aide-backend"
version = "0.1.0"
description = "Aide: voice-first AI shopping assistant (API)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "alembic"]

[[tool.mypy.overrides]]
# Tests use small fakes in place of the real clients.
module = ["tests.*"]
disallow_untyped_decorators = false
# `session.get(...).field` and `response.json()` are fine in tests: a None or a
# wrong shape fails the test anyway.
disable_error_code = ["union-attr", "no-any-return"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
